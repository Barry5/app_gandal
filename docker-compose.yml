version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: savoir-db
    environment:
      POSTGRES_DB: savoir_app
      POSTGRES_USER: savoir_user
      POSTGRES_PASSWORD: savoir_secure_password_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savoir_user -d savoir_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: